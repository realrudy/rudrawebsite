<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting</title>
    <style>
        :root {
            --bg: #0b0f14;
            --secondary-bg: #0f1720;
            --text-primary: #f0f6fa;
            --text-secondary: #b9c6d2;
            --accent: #5ea6c9;
            --accent-hover: #7fbfdc;
            --card-bg: rgba(20, 24, 28, 0.94);
            --card-border: rgba(255, 255, 255, 0.05);
            --card-hover-border: rgba(94, 166, 201, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at top left, rgba(94, 166, 201, 0.12), transparent 26%),
                radial-gradient(circle at 80% 20%, rgba(127, 191, 220, 0.1), transparent 22%),
                linear-gradient(180deg, #0b0f14 0%, #090d12 100%);
            color: var(--text-primary);
            font-family: Inter, system-ui, sans-serif;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 64px 64px;
            opacity: 0.22;
            pointer-events: none;
        }

        .panel {
            width: min(100%, 720px);
            padding: 36px;
            border-radius: 28px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(14px);
            position: relative;
            z-index: 1;
        }

        .panel::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, rgba(94, 166, 201, 0.12), rgba(255, 255, 255, 0));
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(94, 166, 201, 0.12);
            color: var(--accent);
            font-size: 0.86rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 14px;
            font-size: clamp(2rem, 5vw, 3.4rem);
            line-height: 1.05;
            letter-spacing: -0.04em;
            color: var(--text-primary);
        }

        p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .destination {
            margin-top: 8px;
            color: var(--text-primary);
            font-weight: 600;
            word-break: break-word;
        }

        .countdown {
            margin-top: 24px;
            font-size: 0.98rem;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 28px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 18px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .button.primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: #061018;
            box-shadow: 0 10px 24px rgba(94, 166, 201, 0.18);
        }

        .button.secondary {
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.02);
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button.secondary:hover {
            border-color: var(--card-hover-border);
        }

        .fallback {
            margin-top: 14px;
            font-size: 0.95rem;
        }

        .fallback a {
            color: var(--accent-hover);
        }
    </style>
</head>
<body>
    <main class="panel">
        <div class="eyebrow">Redirecting now</div>
        <h1>You are now being redirected.</h1>
        <p>This page will take you to</p>
        <p class="destination" id="destinationLabel">the requested site</p>
        <p class="countdown" id="countdownText">You will be redirected in 5 seconds.</p>
        <div class="actions">
            <a class="button primary" id="continueLink" href="#">Continue now</a>
            <a class="button secondary" href="/">Go back home</a>
        </div>
        <p class="fallback">If the redirect does not happen automatically, click the continue button above.</p>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const destination = params.get('to');
        const label = params.get('label');
        const destinationLabel = document.getElementById('destinationLabel');
        const countdownText = document.getElementById('countdownText');
        const continueLink = document.getElementById('continueLink');

        const safeDestination = (() => {
            if (!destination) {
                return null;
            }

            try {
                const url = new URL(destination);
                if (url.protocol !== 'http:' && url.protocol !== 'https:') {
                    return null;
                }
                return url.toString();
            } catch {
                return null;
            }
        })();

        const displayText = label || (safeDestination ? new URL(safeDestination).hostname : 'the requested site');
        destinationLabel.textContent = displayText;

        if (!safeDestination) {
            countdownText.textContent = 'The destination was not recognized. Use the button below to go home.';
            continueLink.textContent = 'Go back home';
            continueLink.href = '/';
        } else {
            continueLink.href = safeDestination;

            const totalDurationMs = 700;
            const startedAt = Date.now();
            const tick = () => {
                const elapsedMs = Date.now() - startedAt;
                const remainingMs = Math.max(0, totalDurationMs - elapsedMs);
                const secondsRemaining = Math.ceil(remainingMs / 1000);
                countdownText.textContent = `You will be redirected in ${secondsRemaining} second${secondsRemaining === 1 ? '' : 's'}.`;

                if (remainingMs <= 0) {
                    window.location.replace(safeDestination);
                    return;
                }

                window.setTimeout(tick, 250);
            };

            window.setTimeout(tick, 0);
        }
    </script>
</body>
</html>
